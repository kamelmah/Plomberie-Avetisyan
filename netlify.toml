[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Les pages sont pré-rendues : cache long sur les assets fingerprintés,
# revalidation immédiate sur le HTML.
[[headers]]
  for = "/_build/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
